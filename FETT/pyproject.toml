[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[project]
name = "fett"
version = "0.1.0"
description = "Fidelity-Embedding Transformer Translator: multi-fidelity bandgap prediction + cross-fidelity translation."
authors = [
  { name = "Nicholas Kryger-Nelson", email = "nicholas.krygernelson@gmail.com" },
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.3.2",
    "invoke>=2.2.0",
    "lightning>=2.6.1",
    "matplotlib>=3.10.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "pymatgen>=2025.10.7",
    "scikit-learn>=1.5",
    "torch==2.6.0",
]

[project.optional-dependencies]
# Required only to (re)build the raw datasets from public sources.
data = [
    "matminer>=0.9",
    "mp-api>=0.45",
]
# Enable Weights & Biases logging (`training.logger.wandb.enabled=true`).
wandb = [
    "wandb>=0.18",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120
