data:
  name: homemade
  raw_data_dir: data/raw/homemade
  processed_data_dir: data/processed/homemade
  target_col: BG
  split:
  - 0.6
  - 0.2
  - 0.2
  fidelity_map:
    pbe: 0
    scan: 1
    gllb-sc: 2
    hse: 3
    expt: 4
  files:
    pbe: pbe.csv
    scan: SCAN.csv
    gllb-sc: GLLBSC.csv
    hse: HSE.csv
    expt: EXPT.csv
model:
  _target_: src.fett.model.lightning_module.FettLightningModule
  model:
    _target_: src.fett.model.set_based_model.SetBasedBandgapModel
    embedding_dim: 128
    num_heads: 4
training:
  _target_: torch.optim.AdamW
  lr: 0.001
  weight_decay: 1.0e-05
