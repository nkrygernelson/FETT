defaults:
  - _self_

name: homemade
dataset_mode: standard
raw_data_dir: data/raw/homemade
processed_data_dir: data/processed/homemade
target_col: BG

# Split ratios: train, val, test
split: [0.6, 0.2, 0.2]

# Fidelity map: name -> integer ID
# PBE and PBEsol are intentionally separate fidelity levels.
fidelity_map:
  pbe: 0
  pbe-sol: 1
  scan: 2
  gllb-sc: 3
  hse: 4
  expt: 5

# Files to process. Key matches fidelity_map keys. Value is filename.
files:
  pbe: pbe.csv
  pbe-sol: PBESOL.csv
  scan: SCAN.csv
  gllb-sc: GLLBSC.csv
  hse: HSE.csv
  expt: EXPT.csv
