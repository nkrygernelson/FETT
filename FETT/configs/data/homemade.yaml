defaults:
  - _self_

name: homemade
raw_data_dir: data/raw/homemade
processed_data_dir: data/processed/homemade
target_col: BG

# Split ratios: train, val, test
split: [0.6, 0.2, 0.2]

# Fidelity map: name -> integer ID
fidelity_map:
  pbe: 0
  scan: 1
  gllb-sc: 2
  hse: 3
  expt: 4

# Files to process. Key matches fidelity_map keys. Value is filename.
files:
  pbe: pbe.csv
  scan: SCAN.csv
  gllb-sc: GLLBSC.csv
  hse: HSE.csv
  expt: EXPT.csv
