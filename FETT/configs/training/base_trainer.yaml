optimizer:
  _target_: torch.optim.AdamW
  lr: 0.001
  weight_decay: 1e-5

trainer:
  max_epochs: 150
  accelerator: auto
  gradient_clip_val: 1.0
  log_every_n_steps: 10

callbacks:
  early_stopping:
    monitor: val/loss
    patience: 15
    mode: min
  model_checkpoint:
    monitor: val/loss
    mode: min
    save_top_k: 1
    filename: best
    dirpath: models/

batch_size: 64
